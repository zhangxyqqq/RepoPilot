[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "repopilot"
version = "0.1.0"
description = "A local agent engineering and evaluation platform for repository coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.27,<2",
  "openai>=1.40,<3",
]

[project.optional-dependencies]
service = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "alembic>=1.13,<2",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
]

[project.scripts]
repopilot = "repopilot.cli:main"
repopilot-worker = "repopilot.service.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/repopilot"]

[tool.hatch.build.targets.wheel.force-include]
"configs/evaluation" = "repopilot/configs/evaluation"
"configs/faults" = "repopilot/configs/faults"
"configs/retrieval" = "repopilot/configs/retrieval"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
markers = [
  "docker: requires a running Docker daemon",
  "postgres: requires REPOPILOT_TEST_DATABASE_URL (dedicated PostgreSQL database)",
]
